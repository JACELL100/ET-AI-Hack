[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:backend]
command=uvicorn app.main:app --host 0.0.0.0 --port %(ENV_PORT)s --proxy-headers --timeout-keep-alive 120
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:whatsapp-bridge]
; Wait for FastAPI before binding the sidecar port.  Render chooses the first
; listener it sees as the public port, and the bridge otherwise wins while the
; API is importing its ML dependencies.
command=python /app/scripts/start_whatsapp_bridge.py
directory=/app/whatsapp-bridge
environment=BACKEND_PORT="%(ENV_PORT)s",BRIDGE_PORT="3001",ALLOWED_ORIGINS="http://localhost:%(ENV_PORT)s"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
